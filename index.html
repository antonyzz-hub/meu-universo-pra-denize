<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050204">
<title>Meu Universo, Denize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="travado">

<!-- Rosa ilustrada em SVG (desenho próprio, reutilizado com <use>) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rosa" viewBox="0 0 100 150">
      <path d="M50 92C46 112 54 130 50 150" stroke="#21402a" stroke-width="3" fill="none"/>
      <ellipse cx="36" cy="122" rx="12" ry="5" transform="rotate(-35 36 122)" fill="#21402a"/>
      <ellipse cx="64" cy="108" rx="12" ry="5" transform="rotate(35 64 108)" fill="#21402a"/>
      <circle cx="50" cy="50" r="40" fill="#4a0b1c"/>
      <path d="M50 12c22 4 38 22 34 44-4 22-26 34-46 28C18 78 10 56 18 38 24 24 36 14 50 12z" fill="#7a1830"/>
      <path d="M50 24c16 2 28 16 24 32-3 15-19 22-33 17-12-5-16-20-10-31 5-10 12-17 19-18z" fill="#a3243f"/>
      <path d="M50 36c10 0 18 9 15 19-3 9-13 13-21 9-8-4-9-14-4-21 3-4 6-7 10-7z" fill="#c23553"/>
      <path d="M50 46c5 0 9 4 7 9-2 4-8 5-11 2-3-3-2-8 1-10 1-1 2-1 3-1z" fill="#7a1830"/>
      <path d="M30 40c6-6 14-8 20-6M62 70c-8 5-18 4-24-2" stroke="#e0657f" stroke-width="1.5" fill="none" opacity=".6"/>
    </symbol>
  </defs>
</svg>

<canvas id="estrelas" aria-hidden="true"></canvas>

<!-- 1. TELA INICIAL -->
<header id="inicio" class="tela">
  <svg class="rosa r1" viewBox="0 0 100 150" aria-hidden="true"><use href="#rosa"/></svg>
  <svg class="rosa r2" viewBox="0 0 100 150" aria-hidden="true"><use href="#rosa"/></svg>
  <svg class="rosa r3" viewBox="0 0 100 150" aria-hidden="true"><use href="#rosa"/></svg>
  <p class="brilho" aria-hidden="true">✦ ✧ ✦</p>
  <h1 id="nome"></h1>
  <p class="frase" id="frase"></p>
  <button id="abrir" class="btn">Abrir meu presente</button>
</header>

<main id="mundo" hidden>

  <!-- 2. CARTA DE ANIVERSÁRIO -->
  <section>
    <h2>Carta de aniversário</h2>
    <p class="dica" id="dicaEnvelope">toque no envelope para abrir</p>
    <button id="envelope" class="envelope" aria-label="Abrir a carta">
      <span class="bolso"></span><span class="aba"></span><span class="selo" id="selo">♥</span>
    </button>
    <article id="carta" class="carta" hidden></article>
    <button class="segredo" data-i="0" style="top:14%;right:6%" aria-label="Um coração escondido">♥</button>
  </section>

  <!-- 3. NOSSA HISTÓRIA -->
  <section>
    <h2>Nossa história</h2>
    <p class="dica" id="desde"></p>
    <div class="contador">
      <div><b id="cd">0</b><small>dias</small></div>
      <div><b id="ch">0</b><small>horas</small></div>
      <div><b id="cm">0</b><small>minutos</small></div>
      <div><b id="cs">0</b><small>segundos</small></div>
    </div>
    <button class="segredo" data-i="1" style="bottom:8%;left:7%" aria-label="Um coração escondido">♥</button>
  </section>

  <!-- 6. SURPRESA FINAL -->
  <section id="secFinal">
    <h2>Uma última surpresa</h2>
    <p id="progresso" class="dica"></p>
    <button id="btnFinal" class="btn" disabled>Ainda trancada</button>
    <button class="segredo" data-i="2" style="top:10%;left:10%" aria-label="Um coração escondido">♥</button>
  </section>
</main>

<!-- 4. NOSSA MÚSICA (nunca toca sozinha) -->
<aside id="player" hidden>
  <button id="tocar" aria-label="Tocar ou pausar">▶</button>
  <div class="info">
    <span id="faixa"></span>
    <input id="prog" type="range" min="0" max="100" value="0" aria-label="Progresso da música">
  </div>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volume">
</aside>

<div id="aviso" role="status"></div>

<!-- Surpresa final -->
<div id="final" hidden>
  <div class="caixa">
    <svg class="rosa fr" viewBox="0 0 100 150" aria-hidden="true"><use href="#rosa"/></svg>
    <p id="fMensagem"></p>
    <button id="fechar" class="btn">Guardar no coração</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
